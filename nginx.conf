server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O site e um unico HTML com fontes e imagens embutidas em base64.
    # Base64 infla o binario em 33%, e o gzip recupera boa parte disso.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O HTML muda a cada deploy, entao nao pode ficar preso em cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
